# yarn dist: an AppImage and a .deb, unsigned and without auto-update (docs/PLAN.md, "The app")
appId: com.stenograma.kb
productName: Stenograma KB
directories:
  output: dist
# electron-vite's build and the icons it points to (resources/, as electron-vite's ?asset imports expect);
# package.json is always included, and node_modules holds only the "dependencies"
files:
  - out/**/*
  - resources/**/*
  # better-sqlite3 brings every platform's binary and its C sources (27 MB, M0), and the keyring a musl build: this
  # Linux x64 app needs only linux-x64.node and the glibc build
  - "!node_modules/better-sqlite3/{deps,src,build}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/{darwin-*,win32-*,linux-arm64.node,linuxmusl-*}"
  - "!node_modules/@napi-rs/keyring-linux-x64-musl/**"
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  executableName: stenograma-kb
  # The window's WM_CLASS matches the .desktop file (package.json "desktopName"), so GNOME links the two
  syncDesktopName: true
  category: Office
  maintainer: Oleksandr-thescimus <oleksandr.pahutiak@gmail.com>
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
# No publishing: electron-builder would otherwise pick GitHub from "repository" when it runs in CI on a tag
publish: null
